name: Deploy to Azure Static Web Apps

# Keyrir við hverja push á main. Leyndarmálið AZURE_STATIC_WEB_APPS_API_TOKEN
# er búið til í Azure þegar Static Web App er stofnað (IT) og vistað undir
# Settings > Secrets and variables > Actions í GitHub-repoinu.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
